[project]
name = "quantxgb"
version = "0.1.0"
description = "Point-in-time, regime-aware quantitative research platform built around XGBoost."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # data
    "polars>=1.20",
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pandera[polars]>=0.20",
    "exchange-calendars>=4.5",
    # providers / io
    "httpx>=0.27",
    "tenacity>=9.0",
    "yfinance>=0.2.50",
    # config / cli
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    # modelling
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "xgboost>=3.0",
    "optuna>=4.0",
    "hmmlearn>=0.3.3",
    "cvxpy>=1.6",
    "shap>=0.46",
    "mlflow>=2.17",
    # serving
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.39",
    "plotly>=5.24",
    "matplotlib>=3.9",
]

[project.scripts]
quantxgb = "quantxgb.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantxgb"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PD"]
ignore = [
    "N818",    # exception names like HoldoutLocked read better without an Error suffix
    "N803",    # allow math-style argument names (e.g. Sigma)
    "N806",    # allow math-style variable names (e.g. X, Sigma)
    "RUF001", "RUF002", "RUF003",  # allow Greek letters / unicode in docs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018", "E501", "RUF005"]
"src/quantxgb/reporting/report.py" = ["E501"]  # Markdown table rows
"app/**" = ["E501"]                             # UI strings

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src/quantxgb"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (walk-forward, tuning)",
    "network: tests that call external data providers (skipped by default)",
]
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:hmmlearn.*",
]

[tool.coverage.run]
source = ["src/quantxgb"]
omit = ["src/quantxgb/api/*", "src/quantxgb/cli.py"]
