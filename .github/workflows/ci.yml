name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.3"
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests app
          uv run ruff format --check src tests app
      - name: Types
        run: uv run mypy
      - name: Tests (synthetic data only — no downloads in CI)
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: uv run pytest -q --cov --cov-report=term-missing
