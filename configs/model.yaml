# Model configuration — PRD §9.
status: proposed
seed: 42

ranker:
  objective: rank:ndcg            # rank:ndcg | rank:pairwise
  eval_metric: ndcg@5
  early_stopping_rounds: 50
  inner_validation_fraction: 0.2  # tail of each training fold, purged, for early stopping / tuning
  params:                         # defaults used when tuning is disabled
    n_estimators: 500
    learning_rate: 0.03
    max_depth: 3
    min_child_weight: 20
    subsample: 0.8
    colsample_bytree: 0.7
    reg_lambda: 5.0
    reg_alpha: 0.0
    gamma: 0.0

quantile:
  alphas: [0.05, 0.5, 0.95]
  early_stopping_rounds: 50
  params:
    n_estimators: 400
    learning_rate: 0.03
    max_depth: 3
    min_child_weight: 20
    subsample: 0.8
    colsample_bytree: 0.7
    reg_lambda: 5.0

baselines:
  momentum_feature: mom_12_1
  ridge_alpha: 10.0
  random_forest:
    n_estimators: 300
    max_depth: 6
    min_samples_leaf: 50
    max_features: 0.5

tuning:
  enabled: false                  # turn on deliberately; every trial is counted
  n_trials: 40
  search_space:
    max_depth: [2, 5]
    min_child_weight: [5, 100]
    learning_rate: [0.01, 0.1]
    subsample: [0.5, 1.0]
    colsample_bytree: [0.4, 1.0]
    reg_lambda: [0.1, 50.0]

regime:
  rules:
    vol_feature: vix_pct_252      # falls back to market_vol_20 if macro data is absent
    vol_fallback_feature: market_vol_20
    high_vol_quantile: 0.80       # threshold set from the TRAINING window only
    trend_feature: market_above_sma200
  hmm:
    enabled: true
    n_states: 2
    covariance_type: full
    n_iter: 200
    inputs: [market_ret_1d, market_vol_20]
  add_regime_features: true       # add filtered HMM probabilities as (market-wide) features
